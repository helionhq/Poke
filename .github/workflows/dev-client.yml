name: dev-client

# A development build (expo-dev-client) for working on the app from Windows (brief section 3):
# sideload it once, then run `pnpm --filter @poke/mobile exec expo start --dev-client --tunnel`.
# Manual only. Unsigned like the release IPA; the IPA is a workflow artifact, kept 14 days.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build --filter @poke/mobile^...
      - name: Prebuild (runs pod install)
        run: pnpm --filter @poke/mobile exec expo prebuild --platform ios --clean
      - name: Build (unsigned, Debug, device)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Poke.xcworkspace \
            -scheme Poke \
            -configuration Debug \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200
      - name: Package the IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/build/Build/Products/Debug-iphoneos/Poke.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry Poke-dev.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Poke-dev-client
          path: ${{ runner.temp }}/ipa/Poke-dev.ipa
          retention-days: 14
